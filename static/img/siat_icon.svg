<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rodillos / base transportadora de la caja envolvedora Siat -->
  <rect x="6" y="48" width="52" height="6" rx="3" fill="#0f766e"/>
  <circle cx="14" cy="57" r="3" fill="#134e4a"/>
  <circle cx="26" cy="57" r="3" fill="#134e4a"/>
  <circle cx="38" cy="57" r="3" fill="#134e4a"/>
  <circle cx="50" cy="57" r="3" fill="#134e4a"/>

  <!-- Arco lateral / cabezal encintador-envolvedor Siat -->
  <path d="M11 48V18a4 4 0 0 1 4-4h34a4 4 0 0 1 4 4v30" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="23" y="8" width="18" height="9" rx="2.5" fill="#14b8a6" stroke="#0f766e" stroke-width="2"/>
  <circle cx="32" cy="12.5" r="2.2" fill="#ffffff"/>

  <!-- Caja de cartón sellada en el centro -->
  <rect x="17" y="23" width="30" height="24" rx="2.5" fill="#f59e0b" stroke="#92400e" stroke-width="2.2"/>
  <!-- Cinta de empaque / envoltura central -->
