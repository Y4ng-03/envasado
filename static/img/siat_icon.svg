  <path d="M17 31h30" stroke="#b45309" stroke-width="1.8" stroke-dasharray="3 2"/>
  <!-- Solapas superiores -->
  <path d="M32 23v8" stroke="#92400e" stroke-width="1.5"/>
</svg>
