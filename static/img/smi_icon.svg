<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Banda base oscura empacadora SMI -->
  <rect x="5" y="18" width="54" height="28" rx="6" fill="#1e293b"/>
  <!-- Línea transportadora -->
  <rect x="8" y="34" width="48" height="4" rx="2" fill="#94a3b8"/>
  <!-- Cabina de alimentación izquierda -->
  <rect x="11" y="21" width="12" height="15" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="17" cy="17" r="3" fill="#0ea5e9"/>
  <!-- Módulo central SMI con ventana azul -->
  <rect x="26" y="16" width="16" height="21" rx="2.5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.6"/>
  <rect x="29" y="20" width="10" height="8" rx="1.2" fill="#38bdf8"/>
  <rect x="29" y="30" width="10" height="4" rx="1" fill="#334155"/>
  <!-- Salida derecha -->
  <rect x="45" y="24" width="9" height="12" rx="1.5" fill="#cbd5e1"/>
  <line x1="8" y1="42" x2="56" y2="42" stroke="#475569" stroke-width="2"/>
</svg>
